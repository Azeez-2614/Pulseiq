version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulseiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulseiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulseiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:6-jammy
    container_name: pulseiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseiq-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pulseiq
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongodb:27017/
      - USE_FINBERT=False
      - API_KEY=pulseiq-dev-key-change-in-production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
      - mongodb

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseiq-celery-worker
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      - POSTGRES_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pulseiq
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongodb:27017/
      - USE_FINBERT=False
    depends_on:
      - redis
      - postgres
      - mongodb

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseiq-celery-beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseiq-flower
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=ws://api:8000/ws/live
      - NEXT_PUBLIC_API_KEY=pulseiq-dev-key-change-in-production
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
