version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulseiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulseiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulseiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:6-jammy
    container_name: pulseiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseiq-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/pulseiq
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongodb:27017/
      - USE_FINBERT=False
    depends_on:
      - postgres
      - redis
      - mongodb

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseiq-scheduler
    command: python scheduler.py
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/pulseiq
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongodb:27017/
      - PIPELINE_INTERVAL_MINUTES=5
    depends_on:
      - postgres
      - redis
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=ws://api:8000/ws/live
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
