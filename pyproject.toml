[project]
name = "pulseiq"
version = "0.1.0"
description = "Real-Time Market Sentiment & Stock Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yfinance",
    "vaderSentiment",
    "requests",
    "praw",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "redis",
    "pymongo",
    "apscheduler",
    "pandas",
    "scipy",
    "streamlit",
    "transformers",
    "torch",
    "python-dotenv",
    "psycopg2-binary",
    "plotly"
]

[tool.poetry]
name = "pulseiq"
version = "0.1.0"
description = "Real-Time Market Sentiment & Stock Intelligence Platform"
authors = ["Azeez <azeezk@gmail.com>"]
dependencies = { python = "^3.9" }

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.24.1",
    "ruff>=0.0.280"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

